name: Official VS G1 race cycle

on:
  # Start the first regular recording automatically when this workflow is installed.
  # Published race-data commits do not match this path and cannot loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/vs-race-cycle.yml'
      - 'tools/scheduled_vs.py'
      - 'tools/push_recorded_races.py'
      - 'site.js'
      - 'visitor-counter.js'
      - 'index.html'
      - 'registration.js'
      - 'my-arena-stats.js'
      - 'owner-ranking.js'
      - 'firebase-config.js'
      - 'tools/registered_horses.py'
      - 'tools/consume_vs_entries.py'
      - 'tools/horse_appearance_ledger.py'
      - 'tools/weekly_awards.py'
      - 'tools/migrate_g1_history.py'
      - 'tools/reconcile_weekly_registration_count.py'
  workflow_dispatch:
  schedule:
    # 7 minutes before each 15-minute boundary, UTC minutes = JST minutes.
    # GitHub can delay or skip scheduled runs; this is not a hard real-time service.
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: official-vs-races-and-pages
  cancel-in-progress: false

jobs:
  record-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out existing game and website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install 'playwright==1.56.0' 'google-auth[requests]>=2.35,<3'
          command -v google-chrome || command -v chromium
      - name: Migrate existing official G1 starts exactly once
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/migrate_g1_history.py
      - name: Reconcile already published appearances before the next race
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/horse_appearance_ledger.py
      # Auxiliary quota repair must never stop the scheduled race if Firestore
      # is temporarily unavailable. Check this step's log for any correction.
      - name: Reconcile unique weekly horses (one per owner, not per G1 application)
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/reconcile_weekly_registration_count.py
      - name: Synchronize privacy-safe public registration names
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/sync_public_entries.py
      - name: Run original DBF VS race and record all horse motion
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/scheduled_vs.py
      - name: Commit only recorded races and 24h manifest
        run: python tools/push_recorded_races.py
      - name: Count actual completed appearances in permanent Firestore ledger
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/horse_appearance_ledger.py
      # Only successful, already-pushed replay results may consume an entry.
      - name: Consume registrations that already raced
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/consume_vs_entries.py
      - name: Remove consumed entries from public roster
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/sync_public_entries.py
      - name: Count weekly prizes and archive previous weekly champion
        env:
          FIREBASE_PROJECT_ID: derby-vs-arena
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/weekly_awards.py
      - name: Publish refreshed entry count and current weekly TOP10
        run: python tools/push_recorded_races.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage site files only
        run: |
          mkdir -p public_site/races
          cp index.html site.js owner-ranking.js registration.js firebase-config.js race_catalog.json race_playlist.json public_site/
          cp vs_replay_engine_part1.txt vs_replay_engine_part2.txt public_site/
          cp weekly_awards.json my-arena-stats.js public_site/
          cp visitor-counter.js public_site/
          # Publish Google Search Console verification and XML sitemap without changing the arena build.
          if [ -f sitemap.xml ]; then cp sitemap.xml public_site/; fi
          for file in google*.html; do
            if [ -f "$file" ]; then cp "$file" public_site/; fi
          done
          cp -a races/. public_site/races/
      - name: Upload official VS site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public_site'
      - name: Deploy site and recorded race
        id: deploy
        uses: actions/deploy-pages@v4
