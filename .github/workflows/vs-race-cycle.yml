name: Official VS G1 race cycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vs-race-cycle.yml'
      - 'tools/scheduled_vs.py'
      - 'tools/push_recorded_races.py'
      - 'site.js'
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
    - cron: '6,21,36,51 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: official-vs-races-and-pages
  cancel-in-progress: false

jobs:
  record-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out existing game and website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless browser
        run: |
          python -m pip install 'playwright==1.56.0'
          command -v google-chrome || command -v chromium

      - name: Run original DBF VS race and record all horse motion
        run: python tools/scheduled_vs.py

      - name: Commit only recorded races and 24h manifest
        run: python tools/push_recorded_races.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage site files only
        run: |
          mkdir -p public_site/races
          cp index.html site.js race_catalog.json race_playlist.json public_site/
          cp vs_replay_engine_part1.txt vs_replay_engine_part2.txt public_site/
          cp -a races/. public_site/races/

      - name: Upload official VS site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public_site'

      - name: Deploy site and recorded race
        id: deploy
        uses: actions/deploy-pages@v4
