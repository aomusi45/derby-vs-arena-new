<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今週の予想レース｜ダービーファンタジー</title><meta name="description" content="ダービーファンタジーの今週の予想レース。公開済みのレースを選んで競馬新聞とVSシミュレーションを楽しめます。"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071b19;color:#f4ead2;font-family:system-ui,'Noto Sans JP',sans-serif}header{padding:18px 5%;border-bottom:2px solid #ae8b46;background:#102d28}header a{color:#e7cb85}main{max-width:1050px;margin:auto;padding:25px 16px 60px}h1{font-size:clamp(23px,4vw,34px);margin:8px 0}h2{font-size:21px;color:#f2d48d}.panel{border:1px solid #8d7648;border-radius:12px;background:#102925;padding:20px;margin:20px 0}.sub{color:#c2cdbf}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,.file{background:#e4c47a;color:#11241d;padding:12px 17px;border:0;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer}button:disabled{background:#66716a;cursor:not-allowed}input[type=file]{max-width:100%}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #3c544c;padding:9px 5px;text-align:left}th{color:#ebcf8d;white-space:nowrap}.scroll{overflow-x:auto}#status:not(.error){display:none}.error{color:#ffb9a9;white-space:pre-wrap}.ok{color:#c2e5bf}footer{color:#c2cdbf;font-size:13px;margin-top:25px} .settings{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:12px 0}.settings select,.weight-change{background:#f4ead2;color:#11241d;border:1px solid #b9944d;border-radius:6px;padding:7px;font-size:14px}.weight-change{width:76px} </style></head><body><header><a href="./index.html">← 公式VSアリーナへ戻る</a></header><main><h1>🏇 ダービーファンタジー 今週の予想レース</h1><p class="sub" id="predictionNotice">管理人が独断と偏見で馬の能力を判断して走らせています。完全な予想ではありませんので、ご了承ください。</p><section class="panel"><h2>今週の予想レース一覧</h2><div class="row"><label for="raceSelect">レースを選択：</label><select id="raceSelect" aria-label="予想レースを選択" style="min-width:260px;max-width:100%;padding:12px;border-radius:8px;background:#f4ead2;color:#11241d;font-size:15px"></select></div><p id="status" role="status" class="sub"></p></section><section class="panel" id="paper" hidden><h2 id="raceTitle">競馬新聞</h2><p id="raceInfo" class="sub"></p><div class="settings"><label>馬場状態 <select id="goingSelect"><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></label><label>レース展開 <select id="paceSelect"><option value="normal">通常</option><option value="front">先行有利</option><option value="closer">追い込み有利</option></select></label></div><div class="scroll"><table><thead><tr><th>枠</th><th>馬番</th><th>馬名</th><th>脚質</th><th>騎手</th><th>斤量</th><th>馬体重増減 (kg)</th></tr></thead><tbody id="horses"></tbody></table></div></section><section class="panel"><h2>VS予想レース</h2><button id="startRace" disabled>▶ レーススタート</button><button id="againRace" disabled>↻ もう一度レース</button><iframe id="raceFrame" title="DBF VS予想レース" style="display:none;width:100%;height:760px;border:1px solid #b9944d;border-radius:10px;margin-top:15px" allow="fullscreen"></iframe></section></main><script>
'use strict';const $=id=>document.getElementById(id);const status=$('status');const text=(v,max=120)=>String(v??'').slice(0,max);const val=(v)=>Number.isFinite(Number(v))?Number(v):null;
function normalize(data){const race=data.race||data;const horses=data.horses||data.entries||data.runners||race.horses;if(!Array.isArray(horses)||horses.length<2||horses.length>18)throw Error('出走馬は2～18頭の配列で指定してください。');const seen=new Set();const list=horses.map((h,i)=>{const number=val(h.horseNumber??h.number??h.no??h.umaban??(i+1));const name=text(h.horseName??h.name,80);if(!name||!Number.isInteger(number)||number<1||number>18||seen.has(number))throw Error('馬名・馬番が不正、または重複しています。');seen.add(number);return {number,frame:h.frame??h.waku??h.gate??'',name,tactic:text(h.tactic??h.runningStyle??h.style??'',30),jockey:text(h.jockey??'',60),weight:h.weight??h.kinryo??''};});list.sort((a,b)=>a.number-b.number);return {name:text(race.raceName??race.name??data.raceName??'GⅠ予想レース'),venue:text(race.venue??race.track??'',40),distance:race.distance??'',surface:text(race.surface??'',20),horses:list};}
function resetRace(){window.__dfPredictionData=null;$('startRace').disabled=true;$('againRace').disabled=true;$('raceFrame').style.display='none';$('raceFrame').removeAttribute('src');$('paper').hidden=true;}
function render(raw){const d=normalize(raw);resetRace();window.__dfPredictionData=raw;window.__dfWeightChanges={};$('startRace').disabled=false;$('raceTitle').textContent=d.name+'｜競馬新聞';$('raceInfo').textContent=[d.venue,d.surface,d.distance?d.distance+'m':'',d.horses.length+'頭'].filter(Boolean).join(' ／ ');const body=$('horses');body.replaceChildren();for(const h of d.horses){const tr=document.createElement('tr');for(const k of ['frame','number','name','tactic','jockey','weight']){const td=document.createElement('td');td.textContent=text(h[k]);tr.append(td);}const td=document.createElement('td');const inp=document.createElement('input');inp.type='number';inp.className='weight-change';inp.min='-40';inp.max='40';inp.step='1';inp.value=String(window.__dfWeightChanges?.[h.number]??0);inp.setAttribute('aria-label',h.name+' 馬体重増減');inp.addEventListener('change',()=>{let v=Number(inp.value);if(!Number.isFinite(v))v=0;v=Math.max(-40,Math.min(40,Math.round(v)));inp.value=String(v);window.__dfWeightChanges[h.number]=v;});td.append(inp);tr.append(td);body.append(tr);}$('paper').hidden=false;status.className='ok';status.textContent='';}
let races=[],selectedId='',requestId=0;
async function loadSelected(){const token=++requestId;resetRace();const item=races.find(x=>x.id===selectedId);if(!item){status.className='sub';status.textContent='公開中のレースがありません。';return;}status.className='sub';status.textContent='';try{const r=await fetch('./'+item.file,{cache:'no-store'});if(!r.ok)throw Error('出走馬データを取得できません（HTTP '+r.status+'）');const data=await r.json();if(token!==requestId)return;render(data);}catch(e){if(token!==requestId)return;resetRace();status.className='error';status.textContent='読み込み失敗：'+e.message;}}
async function loadPublic(){++requestId;resetRace();status.className='sub';status.textContent='';try{const r=await fetch('./g1-prediction-races.json',{cache:'no-store'});if(!r.ok)throw Error('レース一覧を取得できません（HTTP '+r.status+'）');const data=await r.json();if(!data||!Array.isArray(data.races))throw Error('レース一覧の形式が正しくありません。');const unique=new Set();races=data.races.filter(x=>x&&x.enabled!==false&&typeof x.id==='string'&&/^[a-zA-Z0-9_-]{1,60}$/.test(x.id)&&typeof x.title==='string'&&typeof x.file==='string'&&/^g1-prediction-[a-zA-Z0-9_-]+\.json$/.test(x.file)&&!unique.has(x.id)&&unique.add(x.id));const sel=$('raceSelect');sel.replaceChildren();for(const item of races){const o=document.createElement('option');o.value=item.id;o.textContent=item.title+(item.date?'（'+item.date+'）':'');sel.append(o);}if(!races.length){const o=document.createElement('option');o.textContent='現在、公開中のレースはありません';sel.append(o);sel.disabled=true;status.textContent='公開中のレースはありません。';return;}sel.disabled=false;selectedId=races.some(x=>x.id===selectedId)?selectedId:races[0].id;sel.value=selectedId;await loadSelected();}catch(e){races=[];$('raceSelect').replaceChildren();$('raceSelect').disabled=true;status.className='error';status.textContent='レース一覧の読み込み失敗：'+e.message;}}
function launchPrediction(){
  if(!window.__dfPredictionData)return;
  window.__dfPredictionOptions={going:$('goingSelect').value,pace:$('paceSelect').value,weights:{...window.__dfWeightChanges}};const frame=$('raceFrame');frame.style.display='block';
  frame.src='./g1-prediction-engine.html?run='+Date.now();
  
  $('againRace').disabled=false;
  frame.scrollIntoView({behavior:'smooth',block:'start'});
}
$('startRace').addEventListener('click',launchPrediction);
$('againRace').addEventListener('click',launchPrediction);
$('raceSelect').addEventListener('change',e=>{selectedId=e.target.value;loadSelected();});loadPublic();
</script></body></html>
